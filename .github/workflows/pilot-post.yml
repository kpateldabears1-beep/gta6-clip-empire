name: Publish reviewed GTA highlight
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the reviewed render source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43278864997" | jq -e \
            '.conclusion == "success" and .head_sha == "a72634f0bd4fdf94f5f8b58685a85d41f0c3173f"'
      - uses: actions/download-artifact@v4
        with:
          name: gta-highlight-preview
          run-id: 43278864997
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/highlight
      - name: Publish the reviewed public Short
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install -q 'redis>=5,<8' 'google-api-python-client>=2.150,<3' 'google-auth-httplib2>=0.2,<1'
          python scripts/post_highlight.py "$RUNNER_TEMP/highlight"
