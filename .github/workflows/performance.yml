name: Channel performance and GTA discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'

permissions:
  contents: read
  actions: read
concurrency:
  group: gta-channel-performance
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'redis>=5,<8'
      - name: Snapshot public view counts and rank fresh GTA clips
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: python cloud_report.py
      - name: Notify on a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python monitoring.py
