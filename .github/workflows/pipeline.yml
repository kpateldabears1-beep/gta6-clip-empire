name: GTA clips
on:
  schedule:
    - cron: '15 8,11,14,17,20 * * *'
      timezone: America/Chicago
    - cron: '17 9 * * *'  # 03:17 CST / 04:17 CDT
  workflow_dispatch:
    inputs:
      mode:
        description: Delivery mode
        type: choice
        options: [preview, deliver, verify, gta5-sample, kick-trending, dry-run]
        default: preview
      publish_sample:
        description: Publish the GTA V sample once to the authorized YouTube channel
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: gta-clips-${{ (inputs.mode == 'dry-run' || github.event.schedule == '17 9 * * *') && 'health' || 'delivery' }}
  cancel-in-progress: false

env:
  DAILY_POST_CAP: ${{ vars.DAILY_POST_CAP || secrets.DAILY_POST_CAP || '5' }}

jobs:
  kick-trending:
    if: inputs.mode == 'kick-trending'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Count fresh public clips by channel
        run: |
          python3 - <<'PYTHON'
          from collections import Counter
          from kick import fetch_kick_clips
          clips = fetch_kick_clips()
          print(f"{len(clips)} clips from the past three hours, ranked by views per minute")
          for handle, count in Counter(c["broadcaster_id"] for c in clips).items():
              print(handle, count)
          PYTHON

  health:
    if: inputs.mode == 'dry-run' || github.event.schedule == '17 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      detail: ${{ steps.trace.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install health check dependencies
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then packages+=(ffmpeg); fi
          if ! command -v espeak-ng >/dev/null && ! command -v espeak >/dev/null; then packages+=(espeak-ng); fi
          if (( ${#packages[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          python -m pip install -r requirements-health.txt
      - name: Run live checks without posting
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u main.py --dry-run
      - name: Collect error trace
        id: trace
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/clips-error-trace.txt" ]; then
            {
              echo 'detail<<END_CLIPS_TRACE'
              cat "$RUNNER_TEMP/clips-error-trace.txt"
              echo 'END_CLIPS_TRACE'
            } >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    if: github.event.schedule != '17 9 * * *' && inputs.mode != 'dry-run' && inputs.mode != 'kick-trending' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      detail: ${{ steps.trace.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Chicago posting window
        id: slot
        env:
          RULE: ${{ github.event.schedule }}
          NOV13_VERIFIED_RUN: ${{ vars.NOV13_VERIFIED_RUN }}
          ALLOWED_KICK_CHANNELS: ${{ vars.ALLOWED_KICK_CHANNELS }}
          ALLOWED_BROADCASTER_IDS: ${{ vars.ALLOWED_BROADCASTER_IDS }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import json, os
          cap = int(os.environ["DAILY_POST_CAP"])
          if not 1 <= cap <= 25:
              raise SystemExit("DAILY_POST_CAP must be between 1 and 25")
          rule = os.environ["RULE"]
          now = datetime.now(ZoneInfo("America/Chicago"))
          due = not rule or (now.date() >= date(2026,11,13) and now.hour in (8,11,14,17,20) and now.minute >= 15)
          if rule and now.date() == date(2026,11,13) and os.environ["NOV13_VERIFIED_RUN"]:
              due = False
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  print("The verified November 13 fan-edit batch owns today's five windows.", file=summary)
          if rule and due:
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  print("PREFERRED_CLIP_PLATFORM=" + ("kick" if now.hour in (8,14,20) else "twitch"), file=env)
                  print(f"POSTING_SLOT={now.date()}:{now.hour:02d}", file=env)
              if not (os.environ["ALLOWED_KICK_CHANNELS"] or os.environ["ALLOWED_BROADCASTER_IDS"] or json.loads(Path("streamers.json").read_text())["priority_streamers"]):
                  due = False
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      print("No post: no streamer has been cleared for automated reposting.", file=summary)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("due=" + str(due).lower(), file=f)
          PYTHON
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.due == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'
      - name: Install media tools
        if: steps.slot.outputs.due == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt
      - name: Verify the runner, media output and Redis reservations
        if: inputs.mode == 'verify'
        run: |
          command -v ffmpeg
          command -v ffprobe
          python -m pip check
          python -c 'import yt_dlp, faster_whisper, redis, googleapiclient.discovery, cryptography.fernet'
          docker run --detach --name clips-test-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          for attempt in {1..30}; do
            if docker exec clips-test-redis redis-cli ping | grep -qx PONG; then break; fi
            sleep 1
          done
          python -m pip install 'moto[s3]>=5,<6'
          CLIPS_TEST_MUSIC_MODEL=1 CLIPS_TEST_REDIS_URL=redis://127.0.0.1:6379/15 python -m unittest discover -s tests -v
      - name: Verify the configured Redis connection and reservations
        if: inputs.mode == 'verify'
        env:
          CLIPS_TEST_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ -n "$CLIPS_TEST_REDIS_URL" ]; then
            python -m unittest discover -s tests -p test_redis.py -v
          fi
      - name: Allocate private workspace
        if: steps.slot.outputs.due == 'true' && inputs.mode != 'verify'
        run: |
          work=$(mktemp -d /tmp/gta-clips.XXXXXXXX)
          echo "CLIP_WORK=$work" >> "$GITHUB_ENV"
          echo "HF_HOME=$work/hf" >> "$GITHUB_ENV"
      - name: Render the credited GTA V test Short
        if: inputs.mode == 'gta5-sample'
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            https://archive.org/download/ut-gtav-b-roll/B_ROLL_1.mp4 --output "$CLIP_WORK/original.mp4"
          python scripts/gta5_sample.py "$CLIP_WORK"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'gta5-sample'
        with:
          name: gta5-freeway-short
          path: ${{ env.CLIP_WORK }}/gta5-freeway.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Find and render cleared clips
        id: render
        if: steps.slot.outputs.due == 'true' && inputs.mode != 'verify' && inputs.mode != 'gta5-sample'
        env:
          DELIVERY_MODE: ${{ inputs.mode || 'deliver' }}
          ALLOWED_KICK_CHANNELS: ${{ vars.ALLOWED_KICK_CHANNELS }}
          ALLOWED_BROADCASTER_IDS: ${{ vars.ALLOWED_BROADCASTER_IDS }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ "$DELIVERY_MODE" = deliver ]; then python main.py enqueue "$CLIP_WORK"; fi
          python main.py prepare "$CLIP_WORK"
          if test -s "$CLIP_WORK/batch.json"; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Save videos and source credits for review
        if: steps.render.outputs.ready == 'true'
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: gta-clips-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CLIP_WORK }}/youtube.mp4
            ${{ env.CLIP_WORK }}/tiktok.mp4
            ${{ env.CLIP_WORK }}/batch.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Back up final videos and create Reels download URLs
        id: r2
        if: >-
          ${{ !cancelled() && env.CLIP_WORK != '' &&
          (steps.render.outputs.ready == 'true' || inputs.mode == 'gta5-sample' || failure()) }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python main.py archive "$CLIP_WORK"
      - name: Retain recovery copies after a failure
        if: failure() && env.CLIP_WORK != ''
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CLIP_WORK }}/youtube.mp4
            ${{ env.CLIP_WORK }}/tiktok.mp4
            ${{ env.CLIP_WORK }}/gta5-freeway.mp4
            ${{ env.CLIP_WORK }}/batch.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Deliver videos
        if: success() && steps.r2.outcome == 'success' && steps.render.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.mode == 'deliver')
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
        run: python main.py publish "$CLIP_WORK"
      - name: Remove this run's media and model
        if: always()
        env:
          ARCHIVE_STATUS: ${{ steps.r2.outcome }}
        run: |
          if [ "${ARCHIVE_STATUS:-}" != success ] && [ -n "${CLIP_WORK:-}" ]; then
            for video in youtube.mp4 tiktok.mp4 gta5-freeway.mp4; do
              if [ -f "$CLIP_WORK/$video" ]; then exit 0; fi
            done
          fi
          case "${CLIP_WORK:-}" in /tmp/gta-clips.*) rm -rf -- "$CLIP_WORK";; esac

      - name: Collect error trace
        id: trace
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/clips-error-trace.txt" ]; then
            {
              echo 'detail<<END_CLIPS_TRACE'
              cat "$RUNNER_TEMP/clips-error-trace.txt"
              echo 'END_CLIPS_TRACE'
            } >> "$GITHUB_OUTPUT"
          fi

  publish-sample:
    needs: pipeline
    if: inputs.mode == 'gta5-sample' && inputs.publish_sample && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gta5-freeway-short
          path: ${{ runner.temp }}/gta5-short
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'redis>=5,<8' 'google-api-python-client>=2.150,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Reserve this one-off upload
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/deployments"
          env_name=gta5-freeway-sample
          count=$(gh api "$endpoint?environment=$env_name&per_page=1" --jq length)
          if [ "$count" != 0 ]; then
            echo "This sample already has an upload reservation. Check its earlier run and YouTube Studio."
            exit 1
          fi
          python - <<'PYTHON'
          import os
          from main import reserve, store
          if not reserve(store(), ["sample:gta5-freeway"], os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("Daily post cap reached before sample upload")
          PYTHON
          jq -n --arg ref "$GITHUB_SHA" --arg env "$env_name" \
            '{ref:$ref,environment:$env,auto_merge:false,required_contexts:[],production_environment:false}' \
            | gh api "$endpoint" --input - --jq '.id'
      - name: Upload through the production YouTube client
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from delivery import youtube
          from monitoring import notify_post
          clip = {"title": "Three Trucks, One Freeway Ramp in GTA V",
                  "broadcaster_name": "Unlisted Thoughts (CC0). Edit and sound design by Daily Getaway Clips.",
                  "url": "https://archive.org/details/ut-gtav-b-roll"}
          video_id = youtube(Path(os.environ["RUNNER_TEMP"]) / "gta5-short/gta5-freeway.mp4", clip, "Grand Theft Auto V")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(f"[View the GTA V Short](https://www.youtube.com/shorts/{video_id})", file=summary)
          print(f"YouTube Short: https://www.youtube.com/shorts/{video_id}")
          notify_post("youtube", video_id)
          PYTHON

  scheduled-failure-alert:
    needs: [pipeline, health]
    if: >-
      ${{ always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send the failure trace
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_TRACE: ${{ needs.pipeline.outputs.detail || needs.health.outputs.detail }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitoring.py
