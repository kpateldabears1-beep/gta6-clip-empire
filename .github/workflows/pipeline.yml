name: GTA clips
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Delivery mode
        type: choice
        options: [preview, deliver, verify, gta5-sample]
        default: preview
      publish_sample:
        description: Publish the GTA V sample once to the authorized YouTube channel
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: gta-clips
  cancel-in-progress: false

env:
  DAILY_POST_CAP: ${{ vars.DAILY_POST_CAP || secrets.DAILY_POST_CAP || '5' }}

jobs:
  pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Space scheduled runs across the day
        id: slot
        env:
          RULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import os
          cap = int(os.environ["DAILY_POST_CAP"])
          if not 1 <= cap <= 25:
              raise SystemExit("DAILY_POST_CAP must be between 1 and 25")
          hour = datetime.now(timezone.utc).hour
          rule = os.environ["RULE"]
          hourly = min(cap, 24)
          due = not rule or (cap == 25 if rule == "30 23 * * *" else hour * hourly % 24 < hourly)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("due=" + str(due).lower(), file=f)
          PYTHON
      - uses: actions/checkout@v4
        if: steps.slot.outputs.due == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.due == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install media tools
        if: steps.slot.outputs.due == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt
      - name: Verify the runner, media output and Redis reservations
        if: inputs.mode == 'verify'
        run: |
          command -v ffmpeg
          command -v ffprobe
          python -m pip check
          python -c 'import yt_dlp, faster_whisper, redis, googleapiclient.discovery, cryptography.fernet'
          docker run --detach --name clips-test-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          for attempt in {1..30}; do
            if docker exec clips-test-redis redis-cli ping | grep -qx PONG; then break; fi
            sleep 1
          done
          CLIPS_TEST_REDIS_URL=redis://127.0.0.1:6379/15 python -m unittest discover -s tests -v
      - name: Allocate private workspace
        if: steps.slot.outputs.due == 'true' && inputs.mode != 'verify'
        run: |
          work=$(mktemp -d /tmp/gta-clips.XXXXXXXX)
          echo "CLIP_WORK=$work" >> "$GITHUB_ENV"
          echo "HF_HOME=$work/hf" >> "$GITHUB_ENV"
      - name: Render the credited GTA V test Short
        if: inputs.mode == 'gta5-sample'
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            https://archive.org/download/ut-gtav-b-roll/B_ROLL_1.mp4 --output "$CLIP_WORK/original.mp4"
          python scripts/gta5_sample.py "$CLIP_WORK"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'gta5-sample'
        with:
          name: gta5-freeway-short
          path: ${{ env.CLIP_WORK }}/gta5-freeway.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Find and render cleared clips
        id: render
        if: steps.slot.outputs.due == 'true' && inputs.mode != 'verify' && inputs.mode != 'gta5-sample'
        env:
          DELIVERY_MODE: ${{ inputs.mode || 'deliver' }}
          ALLOWED_BROADCASTER_IDS: ${{ vars.ALLOWED_BROADCASTER_IDS }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ "$DELIVERY_MODE" = deliver ]; then python main.py enqueue "$CLIP_WORK"; fi
          python main.py prepare "$CLIP_WORK"
          if test -s "$CLIP_WORK/batch.json"; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Save videos and source credits for review
        if: steps.render.outputs.ready == 'true'
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: gta-clips-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CLIP_WORK }}/youtube.mp4
            ${{ env.CLIP_WORK }}/tiktok.mp4
            ${{ env.CLIP_WORK }}/batch.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Deliver videos
        if: steps.render.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.mode == 'deliver')
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
        run: python main.py publish "$CLIP_WORK"
      - name: Remove this run's media and model
        if: always()
        run: |
          case "${CLIP_WORK:-}" in /tmp/gta-clips.*) rm -rf -- "$CLIP_WORK";; esac

  publish-sample:
    needs: pipeline
    if: inputs.mode == 'gta5-sample' && inputs.publish_sample && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gta5-freeway-short
          path: ${{ runner.temp }}/gta5-short
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-api-python-client>=2.150,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Reserve this one-off upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/deployments"
          env_name=gta5-freeway-sample
          count=$(gh api "$endpoint?environment=$env_name&per_page=1" --jq length)
          if [ "$count" != 0 ]; then
            echo "This sample already has an upload reservation. Check its earlier run and YouTube Studio."
            exit 1
          fi
          jq -n --arg ref "$GITHUB_SHA" --arg env "$env_name" \
            '{ref:$ref,environment:$env,auto_merge:false,required_contexts:[],production_environment:false}' \
            | gh api "$endpoint" --input - --jq '.id'
      - name: Upload through the production YouTube client
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from delivery import youtube
          clip = {"title": "Three Trucks, One Freeway Ramp in GTA V",
                  "broadcaster_name": "Unlisted Thoughts (CC0). Edit and sound design by Daily Getaway Clips.",
                  "url": "https://archive.org/details/ut-gtav-b-roll"}
          video_id = youtube(Path(os.environ["RUNNER_TEMP"]) / "gta5-short/gta5-freeway.mp4", clip, "Grand Theft Auto V")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(f"[View the GTA V Short](https://www.youtube.com/shorts/{video_id})", file=summary)
          print(f"YouTube Short: https://www.youtube.com/shorts/{video_id}")
          PYTHON
